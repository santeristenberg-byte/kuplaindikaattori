name: Kuplaindikaattori

on:
  schedule:
    - cron: "0 6 * * 6"     # lauantaisin 06:00 UTC = klo 9 kesäaikaan, klo 8 talviaikaan
  workflow_dispatch:         # käsin käynnistys: Actions → Kuplaindikaattori → Run workflow

permissions:
  contents: write            # bot saa tallentaa historian ja arkiston repoon

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna kirjastot
        run: pip install -r requirements.txt

      - name: Laske kuplamittari
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python kupla.py --no-email

      - name: Kirjoita ja lähetä uutiskirje
        if: always()           # ajetaan myös jos laskenta kaatui: silloin tulee virheilmoitus
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}   # esim. https://kayttaja.github.io/repo — ks. UUTISKIRJE.md, "Verkkosivu"
          LIITA_RAPORTTI: "0"  # tekninen raportti liitteeksi; aseta "1" jos haluat sen taas vain itsellesi
          # TUTKA_ILMOITUS: "Laatija omistaa ..."   # eturistiriitailmoitus ennen kaupallista jakelua
        run: python newsletter.py

      - name: Tallenna historia repoon
        if: always()
        run: |
          git config user.name "kupla-bot"
          git config user.email "kupla-bot@users.noreply.github.com"
          git add data outputs newsletter
          git commit -m "Viikkoajo $(date -u +%F)" || echo "Ei muutoksia"
          git push
